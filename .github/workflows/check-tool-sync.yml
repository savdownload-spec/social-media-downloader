name: Check Tool Sync

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/config/tools.ts'
      - 'src/config/toolGuides*.ts'
      - 'prisma/schema.prisma'
  workflow_dispatch:

jobs:
  check-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check tool synchronization
        run: npm run check:tool-sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Comment on PR if sync failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Tool Sync Check Failed

              The tool definitions in TypeScript don't match the database ToolConfig records.

              **How to fix:**
              1. Run \`npm run check:tool-sync\` locally to see the specific issues
              2. Run \`npm run db:seed:tools\` to sync missing tools
              3. Review any extra or mismatched tools
              4. Commit any necessary changes

              For more details, see the [workflow run](https://github.com/${{context.repo.owner}}/${{context.repo.repo}}/actions/runs/${{context.runId}}).`
            })
