version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# SavDown — full local stack
#
# Services:
#   postgres    – primary database (PostgreSQL 16)
#   redis       – cache + rate-limiting (Redis 7)
#   yt-dlp      – video/audio downloader sidecar
#   gallery-dl  – image gallery downloader sidecar
#   app         – Next.js application (build with: docker compose build app)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smd-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       downloader
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d downloader"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache / Rate-limiting ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── yt-dlp sidecar ────────────────────────────────────────────────────────
  # Lightweight FastAPI wrapper around yt-dlp.
  # The Next.js app calls this via DOWNLOADER_API_URL when YTDLP_BIN is not
  # available in the Next.js container itself.
  #
  # Alternative: set YTDLP_BIN=/usr/local/bin/yt-dlp directly in the app
  # container and skip this sidecar.
  ytdlp:
    image: python:3.12-slim
    container_name: smd-ytdlp
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8001:8001"
    volumes:
      - ./services/ytdlp:/app
      - ytdlp_cache:/root/.cache/yt-dlp
    command: >
      sh -c "pip install --quiet yt-dlp fastapi uvicorn &&
             uvicorn main:app --host 0.0.0.0 --port 8001"
    environment:
      YTDLP_CACHE_DIR: /root/.cache/yt-dlp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── gallery-dl sidecar ────────────────────────────────────────────────────
  gallerydl:
    image: python:3.12-slim
    container_name: smd-gallerydl
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8002:8002"
    volumes:
      - ./services/gallerydl:/app
      - gallerydl_cache:/root/.cache/gallery-dl
    command: >
      sh -c "pip install --quiet gallery-dl fastapi uvicorn &&
             uvicorn main:app --host 0.0.0.0 --port 8002"
    environment:
      GALLERY_DL_CACHE_FILE: /root/.cache/gallery-dl/cache.sqlite3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Next.js app (optional — use `npm run dev` locally instead) ────────────
  # app:
  #   build: .
  #   container_name: smd-app
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis:    { condition: service_healthy }
  #   env_file: .env

volumes:
  postgres_data:
  redis_data:
  ytdlp_cache:
  gallerydl_cache:
